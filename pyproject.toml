[project]
name = "discord-brobot"
version = "0.1.0"
description = "Bare implementation  of `Broiestbot` for Discord."
authors = [{ name = "Todd Birchard", email = "toddbirchard@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["Discord", "Bot", "Chatbot", "Python", "Discord Bot"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "discord",
    "loguru>=0.7.2,<0.8.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pytz>=2024.1,<2025.0.0",
    "uvicorn",
]

[project.urls]
homepage = "https://github.com/toddbirchard/discord-brobot/"
repository = "https://github.com/toddbirchard/discord-brobot/"
documentation = "https://github.com/toddbirchard/discord-brobot/"
issues = "https://github.com/toddbirchard/discord-brobot/issues"

[dependency-groups]
dev = [
    "pytest>=8.1.2,<9.0.0",
    "black>=24.4.2,<25.0.0",
    "isort>=5.13.2,<6.0.0",
    "coverage>=7.5.0,<8.0.0",
    "flake8>=7.0.0,<8.0.0",
    "pylint>=3.1.0,<4.0.0",
]

[tool.uv]
# This project is a deployed application, not a distributable library, so uv
# manages its environment without building/installing it. Its modules are
# top-level (`asgi`, `config`, `log`), which are names that should not be
# installed into a shared site-packages.
package = false

[tool.isort]
profile = "black"
line_length = 125
